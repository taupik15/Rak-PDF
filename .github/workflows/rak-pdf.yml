name: Rak PDF - sync and deploy
on:
  push:
    branches: [main]
    paths: ['app.js', 'catalog.js', 'reader.js', 'index.html', 'style.css', 'data/**', 'vendor/**', 'scripts/**', '.github/workflows/rak-pdf.yml']
  schedule:
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Number of public book detail pages to check (1–150)'
        type: number
        default: 40
concurrency:
  group: rak-pdf-pages
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test link resolver
        run: python -m unittest discover -s tests
      - name: Install browser for public reading links
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Refresh public links
        env:
          SYNC_LIMIT: ${{ inputs.limit || 40 }}
        run: |
          python scripts/sync_ebooksunnah.py --limit "$SYNC_LIMIT" || echo '::warning::Source unavailable or sync incomplete; publishing retained catalog.'
      - name: Save catalog updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ebooksunnah.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: sync public Ebook Sunnah reading links'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare only public web files
        run: |
          mkdir -p _site
          cp -r .nojekyll index.html app.js catalog.js reader.js style.css data vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
